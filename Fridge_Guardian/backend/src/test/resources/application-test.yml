spring:
  datasource:
    url: jdbc:h2:mem:fridgetest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
app:
  frontend-url: http://localhost:3000
  jwt:
    # 테스트 전용 키(Base64, 32바이트). 운영 키가 아닙니다.
    secret: dGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LTMyLWJ5dGVzISE=
  upload:
    dir: target/test-uploads
  batch:
    scheduler-enabled: false
  openai:
    api-key: ""
