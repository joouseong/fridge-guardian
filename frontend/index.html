<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f2e8" />
    <meta name="description" content="냉장고 속 식재료부터 오늘의 메뉴까지, 냉장고 문지기와 함께 준비하세요." />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <script>
      // 첫 화면이 그려지기 전에 저장된 테마를 적용해 깜박임을 막습니다. (src/lib/theme.js와 같은 규칙)
      try {
        var t = localStorage.getItem('fridge-guardian-theme')
        var dark = t === 'dark' || ((t !== 'light') && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <title>냉장고 문지기 | Fridge Guardian</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite가 React 앱의 시작 파일을 불러옵니다. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
